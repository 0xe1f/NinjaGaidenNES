name: verify

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Same pin as tools/install-cc65 (cc65 V2.19). Binaries only.
      - name: Build ca65 and ld65
        run: |
          git clone --depth 1 --branch V2.19 https://github.com/cc65/cc65.git /tmp/cc65
          make -C /tmp/cc65 bin
          mkdir -p tools
          cp /tmp/cc65/bin/ca65 /tmp/cc65/bin/ld65 tools/

      - name: make verify
        run: make verify

      - name: Discard assembled ROM
        if: always()
        run: rm -f NinjaGaiden.nes

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report
        run: |
          python3 tools/coverage.py --badges "$RUNNER_TEMP/badges" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Shields.io cannot read this private repo, so the numbers are in
      # the image URL. [skip ci] keeps the follow-up push from running again.
      - name: Update coverage shields
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/coverage.py --readme README.md
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update coverage shields [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
