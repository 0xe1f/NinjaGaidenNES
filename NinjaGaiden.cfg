# ld65 layout for the iNES image: 16-byte header, then 128 KiB PRG, then 128 KiB CHR.
#
# PRG file banks 0-6 run at $8000 (16 KiB window). Bank 7 runs at $C000.
# Reset writes MMC1 control $1E: vertical mirroring, 16 KiB PRG with the
# last bank fixed at $C000, 4 KiB CHR. CHR slots below are still the 8 KiB
# file banks, not those 4 KiB windows.

MEMORY {
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    PRG0:   start = $8000, size = $4000, file = %O, fill = yes;
    PRG1:   start = $8000, size = $4000, file = %O, fill = yes;
    PRG2:   start = $8000, size = $4000, file = %O, fill = yes;
    PRG3:   start = $8000, size = $4000, file = %O, fill = yes;
    PRG4:   start = $8000, size = $4000, file = %O, fill = yes;
    PRG5:   start = $8000, size = $4000, file = %O, fill = yes;
    PRG6:   start = $8000, size = $4000, file = %O, fill = yes;
    PRG7:   start = $C000, size = $4000, file = %O, fill = yes;
    CHR:    start = $0000, size = $20000, file = %O, fill = yes;
}

SEGMENTS {
    HEADER: load = HEADER, type = ro;

    PRG0: load = PRG0, type = ro;
    PRG1: load = PRG1, type = ro;
    PRG2: load = PRG2, type = ro;
    PRG3: load = PRG3, type = ro;
    PRG4: load = PRG4, type = ro;
    PRG5: load = PRG5, type = ro;
    PRG6: load = PRG6, type = ro;
    PRG7: load = PRG7, type = ro;

    CHR0:  load = CHR, type = ro, start = $00000;
    CHR1:  load = CHR, type = ro, start = $02000;
    CHR2:  load = CHR, type = ro, start = $04000;
    CHR3:  load = CHR, type = ro, start = $06000;
    CHR4:  load = CHR, type = ro, start = $08000;
    CHR5:  load = CHR, type = ro, start = $0A000;
    CHR6:  load = CHR, type = ro, start = $0C000;
    CHR7:  load = CHR, type = ro, start = $0E000;
    CHR8:  load = CHR, type = ro, start = $10000;
    CHR9:  load = CHR, type = ro, start = $12000;
    CHR10: load = CHR, type = ro, start = $14000;
    CHR11: load = CHR, type = ro, start = $16000;
    CHR12: load = CHR, type = ro, start = $18000;
    CHR13: load = CHR, type = ro, start = $1A000;
    CHR14: load = CHR, type = ro, start = $1C000;
    CHR15: load = CHR, type = ro, start = $1E000;
}
